# CI/CD Automation (Github Actions Workflow)

name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit pytest

      - name: SAST - Run Bandit
        run: |
          bandit -r . -x ./.venv

      - name: SCA - Dependency Vulnerability Scan
        run: |
          pip-audit

      - name: Automated Unit Tests
        run: |
          python -c "from tools import lookup_plant; assert lookup_plant('pothos')['found'] == True"